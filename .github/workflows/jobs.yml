name: Jobs Test
on:
  workflow_run:
    workflows: [Validate Files]
    types:
      - completed

jobs:
  validate-html:
    runs-on: windows-latest
    steps:
      - name: get repo code
        uses: actions/checkout@v3

      - name: validate html file
        run: test -f index.html

  validate-js:
    runs-on: windows-latest
    steps:
      - name: get repo code
        uses: actions/checkout@v3

      - name: validate js file
        run: test -f script.js

  validate-code:
    needs: [validate-html, validate-js]
    runs-on: windows-latest
    steps:
      - name: get repo code
        uses: actions/checkout@v3

      - name: validate js code
        run: node --check script.js

      - name: validate html code
        run: npx htmlhint index.html
